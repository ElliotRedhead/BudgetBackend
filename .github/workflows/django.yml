name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d budget"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/budget
    steps:
      #----------------------------------------------
      #                Checkout repo
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      #----------------------------------------------
      #     Install uv, python and dependencies
      #----------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #              Lint and type check
      #----------------------------------------------
      - name: Lint and type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
      #----------------------------------------------
      #       Run test suite & upload coverage
      #----------------------------------------------
      - name: Run tests
        run: uv run pytest -vv --cov=./ --cov-report=xml
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
