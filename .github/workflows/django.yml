name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #                Checkout repo
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v2
      #----------------------------------------------
      #     Install uv, python and dependencies
      #----------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #       Run test suite & upload coverage
      #----------------------------------------------
      - name: Run tests
        run: uv run pytest -vv --cov=./ --cov-report=xml
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v3
