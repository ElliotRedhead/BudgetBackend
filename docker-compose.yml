services:
  db:
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_DB=budget
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget"]
      interval: 2s
      timeout: 5s
      retries: 15
  django:
    build:
      context: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/budget
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-local-development-only-secret-key-not-for-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
