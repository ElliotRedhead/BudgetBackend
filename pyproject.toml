[project]
name = "budgetdrfbackend"
version = "0.1.0"
description = "A backend for the Budget project."
authors = [{ name = "Elliot Redhead", email = "elliot@elliotredhead.com" }]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]<3.18",
    "factory-boy>=3.3.3",
    "faker>=40.39.0",
    "nplusone>=1.0.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-factoryboy>=2.8.1",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.9",
    "types-django-filter>=26.1.0.20260713",
    "werkzeug>=3.1.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "budget.test_settings"

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "W"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
omit = [
	"*/tests*",
	"*/migrations/*",
	"*/__init__.py",
	"*/asgi.py",
	"*/manage.py",
	"*/settings.py",
	"*/wsgi.py",
	]

[tool.coverage.project.default]
informational = true

[tool.coverage.patch.default]
informational = true

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]
explicit_package_bases = true

[tool.django-stubs]
django_settings_module = "budget.test_settings"
