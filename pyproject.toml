[project]
name = "budgetdrfbackend"
version = "0.1.0"
description = "A backend for the Budget project."
authors = [{ name = "Elliot Redhead", email = "elliot@elliotredhead.com" }]
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-extensions>=4.1",
    "factory-boy>=3.3.3",
    "faker>=40.39.0",
    "flake8>=7.4.1",
    "isort>=9.0.1",
    "nplusone>=1.0.0",
    "pre-commit>=4.6.2",
    "pydocstyle[toml]>=6.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-factoryboy>=2.8.1",
    "pytest-randomly>=5.0.0",
    "werkzeug>=3.1.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "budget.test_settings"

[tool.pydocstyle]
inherit = false
ignore = ["D100","D203", "D212"]

[tool.isort]
profile = "black"

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
omit = [
	"*/tests*",
	"*/migrations/*",
	"*/__init__.py",
	"*/asgi.py",
	"*/manage.py",
	"*/settings.py",
	"*/wsgi.py",
	]

[tool.coverage.project.default]
informational = true

[tool.coverage.patch.default]
informational = true
