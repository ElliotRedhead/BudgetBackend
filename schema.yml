openapi: 3.0.3
info:
  title: Budget Backend
  version: 0.0.0
  description: DRF backend for budget-management.
paths:
  /budgets/:
    get:
      operationId: budgets_list
      description: Monthly budgets belonging to the requesting user.
      parameters:
      - in: query
        name: month
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - budgets
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetList'
          description: ''
    post:
      operationId: budgets_create
      description: Monthly budgets belonging to the requesting user.
      tags:
      - budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /budgets/{id}/:
    get:
      operationId: budgets_retrieve
      description: Monthly budgets belonging to the requesting user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this budget.
        required: true
      tags:
      - budgets
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    put:
      operationId: budgets_update
      description: Monthly budgets belonging to the requesting user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this budget.
        required: true
      tags:
      - budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    patch:
      operationId: budgets_partial_update
      description: Monthly budgets belonging to the requesting user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this budget.
        required: true
      tags:
      - budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    delete:
      operationId: budgets_destroy
      description: Monthly budgets belonging to the requesting user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this budget.
        required: true
      tags:
      - budgets
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /expenses/:
    get:
      operationId: expenses_list
      description: Viewset definition related to Expense model.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - eating_out
          - groceries
          - health
          - housing
          - leisure
          - other
          - shopping
          - transport
          - utilities
        description: |-
          * `groceries` - Groceries
          * `housing` - Housing
          * `utilities` - Utilities
          * `transport` - Transport
          * `health` - Health
          * `eating_out` - Eating out
          * `leisure` - Leisure
          * `shopping` - Shopping
          * `other` - Other
      - in: query
        name: cost__gt
        schema:
          type: integer
      - in: query
        name: cost__lt
        schema:
          type: integer
      - in: query
        name: date_range
        schema:
          type: string
          format: date-time
          enum:
          - month
          - today
          - week
          - year
          - yesterday
        description: |-
          The date that the expense was conducted.

          * `today` - Today
          * `yesterday` - Yesterday
          * `week` - Past 7 days
          * `month` - This month
          * `year` - This year
      - in: query
        name: name__icontains
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenseList'
          description: ''
    post:
      operationId: expenses_create
      description: Viewset definition related to Expense model.
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Expense'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Expense'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /expenses/{id}/:
    get:
      operationId: expenses_retrieve
      description: Viewset definition related to Expense model.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    put:
      operationId: expenses_update
      description: Viewset definition related to Expense model.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Expense'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Expense'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    patch:
      operationId: expenses_partial_update
      description: Viewset definition related to Expense model.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExpense'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExpense'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExpense'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    delete:
      operationId: expenses_destroy
      description: Viewset definition related to Expense model.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /expenses/export/:
    get:
      operationId: expenses_export_retrieve
      description: Download the (optionally filtered) expenses as CSV, oldest first.
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /expenses/import/:
    post:
      operationId: expenses_import_create
      description: Create expenses from a CSV upload. Nothing is saved if any row
        fails.
      tags:
      - expenses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseImport'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseImportResult'
          description: ''
  /expenses/summary/:
    get:
      operationId: expenses_summary_retrieve
      description: Total spending for a month against its budget, split by category.
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM. Defaults to the current month.
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummary'
          description: ''
  /schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /user/login/:
    post:
      operationId: user_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /user/logout/:
    post:
      operationId: user_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /user/refresh/:
    post:
      operationId: user_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /user/register/:
    post:
      operationId: user_register_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        month:
          type: string
          format: date
          description: The first day of the month budgeted for.
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Budget in smallest denomination. e.g. (£10 = 1000)
      required:
      - amount
      - id
      - month
    CategoryEnum:
      enum:
      - groceries
      - housing
      - utilities
      - transport
      - health
      - eating_out
      - leisure
      - shopping
      - other
      type: string
      description: |-
        * `groceries` - Groceries
        * `housing` - Housing
        * `utilities` - Utilities
        * `transport` - Transport
        * `health` - Health
        * `eating_out` - Eating out
        * `leisure` - Leisure
        * `shopping` - Shopping
        * `other` - Other
    CategoryTotal:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        total:
          type: integer
      required:
      - category
      - total
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          format: email
          title: Email address
          readOnly: true
        name:
          type: string
          maxLength: 30
        category:
          $ref: '#/components/schemas/CategoryEnum'
        cost:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Price of expense in smallest denomination. e.g. (£10 = 1000)
        date:
          type: string
          format: date-time
          description: The date that the expense was conducted.
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - cost
      - date_created
      - date_modified
      - id
      - name
      - user
    ExpenseImport:
      type: object
      properties:
        file:
          type: string
          format: uri
          description: CSV with columns date, name, category, cost (in pounds).
      required:
      - file
    ExpenseImportResult:
      type: object
      properties:
        created:
          type: integer
      required:
      - created
    MonthlySummary:
      type: object
      properties:
        month:
          type: string
          format: date
          description: The first day of the month.
        budget:
          type: integer
          nullable: true
          description: The month's budget, or the latest earlier one. Null if none
            set.
        budget_month:
          type: string
          format: date
          nullable: true
          description: The month the budget was set for.
        total:
          type: integer
          description: Total spent in the month.
        remaining:
          type: integer
          nullable: true
          description: Budget minus total. Null if no budget.
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotal'
      required:
      - budget
      - budget_month
      - by_category
      - month
      - remaining
      - total
    PaginatedBudgetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
    PaginatedExpenseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
    PatchedBudget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        month:
          type: string
          format: date
          description: The first day of the month budgeted for.
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Budget in smallest denomination. e.g. (£10 = 1000)
    PatchedExpense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          format: email
          title: Email address
          readOnly: true
        name:
          type: string
          maxLength: 30
        category:
          $ref: '#/components/schemas/CategoryEnum'
        cost:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Price of expense in smallest denomination. e.g. (£10 = 1000)
        date:
          type: string
          format: date-time
          description: The date that the expense was conducted.
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_modified:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      description: Create a user and respond with a JWT pair, so they're logged in
        at once.
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "JWT"
